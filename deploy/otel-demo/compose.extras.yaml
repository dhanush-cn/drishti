# Drishti's layer over the OTel Demo 3.1.0 (copied to ~/otel-demo/compose.extras.yaml,
# which `make start-minimal-no-o11y` always loads last: the demo's own seam for forks).
#
# Memory headroom for services that sit at their upstream limits on this laptop.
# Recorded 3 Nov (docs/test-harness.md, "Memory headroom"): checkout and product-catalog
# at 100% of 20M from the first minute with GOMEMLIMIT=16MiB, their CPU climbing from
# ~0.9 to 3.1-3.6 cores over two hours (garbage collection against the cap). That starved
# the Docker VM until DNS and connections between containers timed out, and 48.7% of
# Locust requests failed with no flag on.
#
# Only limits change; no service's code, flags or telemetry. ad is left alone: its JVM
# heap is fixed at -Xmx200m inside a 300M container (95-97% is normal for a JVM there),
# and adHighCpu/adManualGc are scenarios about that JVM. email and recommendation are
# left alone too: their memory-leak scenarios must hit the upstream limits.
services:
  checkout:
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      - GOMEMLIMIT=100MiB
  product-catalog:
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      - GOMEMLIMIT=100MiB
  flagd:
    deploy:
      resources:
        limits:
          memory: 150M
    environment:
      - GOMEMLIMIT=120MiB
  frontend:
    deploy:
      resources:
        limits:
          memory: 512M
  payment:
    deploy:
      resources:
        limits:
          memory: 256M
