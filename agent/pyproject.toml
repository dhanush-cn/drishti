[project]
name = "drishti-agent"
version = "0.1.0"
description = "Drishti's root-cause agent, one-prompt baseline and eval harness (docs/evals.md)"
# langchain-core (a LangGraph dependency) needs 3.11.
requires-python = ">=3.11"
# Each dependency earns its place:
# - pydantic: typed tool results and answers.
# - langgraph (patch 56): the investigation as a graph whose state is saved between steps, so Week 6 can
#   resume after a crash, pause for a human and loop over hypotheses. Pinned exactly: defaults change
#   between versions (the step limit went from 25 to 10,007 in 1.x).
# - langgraph-checkpoint-postgres + psycopg (patch 61): the graph's state saved in Postgres after every step, so an
#   investigation survives a crash and can wait for a human's approval across restarts.
# - fastapi + uvicorn + psycopg-pool (patch 66): the agent service (start, watch over SSE, approve), with a pool so
#   several investigations share the Postgres checkpointer safely.
# Model calls do NOT go through LangChain: llm.py talks HTTP with the standard library, so the code that
# talks to the model is code we can read, and Gemini's thought signatures go back verbatim (patch 50).
dependencies = ["pydantic>=2.5", "langgraph==1.2.24", "langgraph-checkpoint-postgres==3.2.1", "psycopg[binary]==3.3.9",
                "psycopg-pool==3.3.3", "fastapi==0.165.0", "uvicorn==0.54.0"]

[project.scripts]
drishti-eval = "drishti_agent.evals.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["drishti_agent*"]

[tool.setuptools.package-data]
# The runbooks (patch 63): service facts, the symptoms guide, the recall query set and the rendered runbooks.
drishti_agent = ["runbooks/*.json", "runbooks/*.md", "runbooks/rendered/*.md"]
