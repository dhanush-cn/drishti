services:
  loadgen:
    # Benchmark-only: the profile keeps it out of a plain `docker compose up`.
    # Build with scripts/build-loadgen.sh so run.json records the commit.
    profiles: ["bench"]
    image: drishti-loadgen:dev
    build:
      context: .
      target: loadgen
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_DIRTY: ${GIT_DIRTY:-unknown}
    # Container-to-container, like the collector (docs/loadgen.md §8): no
    # Docker Desktop port-forwarding hop between generator and receiver.
    command: ["-target", "receiver:4317"]
    # Runs as your WSL user so results in ./bench/runs are yours, not root's.
    user: "${DRISHTI_UID:-1000}:${DRISHTI_GID:-1000}"
    volumes:
      - ./bench/runs:/runs
    depends_on:
      - receiver
    networks:
      default: {}
  storage:
    image: drishti-storage:dev
    build:
      context: .
      target: storage
    # Healthy, not just started: the consumer checks the table at startup
    # and exits if ClickHouse is not answering yet.
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      DRISHTI_KAFKA_BROKERS: "kafka:29092"
      DRISHTI_CLICKHOUSE_URL: "http://clickhouse:8123"
      # A new group starts at the END of otlp.logs on this laptop: Kafka
      # holds up to 24 h of receiver-only benchmark traffic with stale
      # timestamps. Production would start at earliest (the flag default).
      # Only matters while the group has no committed offset.
      DRISHTI_STORAGE_RESET: "latest"
      # Static member: a restarted container takes over at once (docs/storage.md
      # decision 7). One replica here; more replicas need distinct IDs.
      DRISHTI_STORAGE_INSTANCE_ID: "storage-1"
      DRISHTI_STORAGE_SESSION_TIMEOUT: "15s"
      # Kill test only (week3b.sh sets it for one run): exit after the Nth
      # insert without committing it.
      DRISHTI_STORAGE_DEBUG_CRASH_AFTER_INSERTS: "${STORAGE_CRASH_AFTER:-0}"
      GOMEMLIMIT: "600MiB"
      DRISHTI_PPROF_ADDR: ":6060"
    ports:
      - "127.0.0.1:16061:6060"
    # Six open batches (up to 32 MiB each) + up to 192 MiB handed to
    # background inserts (-max-pending-bytes) + one decoded message each:
    # ~400 MiB at the worst case, under GOMEMLIMIT 600MiB.
    mem_limit: 768m
    networks:
      default: {}
  receiver:
    image: drishti-receiver:dev
    build:
      context: .
      target: receiver
    depends_on:
      - kafka
    environment:
      DRISHTI_LISTEN: ":4317"
      DRISHTI_KAFKA_BROKERS: "kafka:29092"
      GOMEMLIMIT: "400MiB"
      # Profiling endpoint (internal/pprofsrv). Idle cost is nil; a CPU
      # profile samples only while one is being fetched.
      DRISHTI_PPROF_ADDR: ":6060"
    ports:
      - "14317:4317"
      # Loopback only: profiles expose internals, so not on the LAN.
      - "127.0.0.1:16060:6060"
    # Explicit on purpose. A service that declares networks: is attached
    # ONLY to the ones it lists, so without this line, merging
    # docker-compose.demo.yml (which adds the demo network) would drop
    # default and the receiver could no longer resolve kafka:29092.
    networks:
      default: {}
    mem_limit: 512m
  kafka:
    image: apache/kafka:4.3.1
    container_name: drishti-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      # --- KRaft: one node is both broker and controller ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: zGQUL0xjSvW9aiXWByiBTw

      # --- Listeners: one for containers, one for your WSL shell ---
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Single node: internal topics can only have 1 replica ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # --- Behaviour ---
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 24

      # --- Memory: small heap, leave the rest to the page cache ---
      KAFKA_HEAP_OPTS: "-Xms1g -Xmx1g"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 3g
    # The check starts a fresh JVM (kafka-broker-api-versions.sh): ~2 cores
    # for ~2 s. At the old 10 s interval that was a ~2.3-core spike every
    # ~12 s in every benchmark run, at every rate (Week 1 sweep stats).
    # start_interval keeps startup detection fast (every 3 s during the
    # first 45 s); after that the check runs once a minute. Benchmarks start
    # at least start_period after Kafka starts.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s
      start_interval: 3s

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    container_name: drishti-clickhouse
    hostname: clickhouse
    ports:
      - "8123:8123"   # HTTP interface: curl, browser, debugging
      - "9000:9000"   # native protocol: what the Go client uses
    environment:
      CLICKHOUSE_DB: drishti
      CLICKHOUSE_USER: drishti
      CLICKHOUSE_PASSWORD: drishti_dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 6g
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "drishti", "--password", "drishti_dev", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  redis:
    image: redis:8.10.2
    container_name: drishti-redis
    hostname: redis
    ports:
      - "6381:6379"
    command:
      - redis-server
      - --maxmemory
      - 400mb
      - --maxmemory-policy
      - volatile-lru
      - --save
      - ""
      - --appendonly
      - "no"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  kafka-data:
  clickhouse-data:

networks:
  default: {}
