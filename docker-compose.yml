services:
  loadgen:
    # Benchmark-only: the profile keeps it out of a plain `docker compose up`.
    # Build with scripts/build-loadgen.sh so run.json records the commit.
    profiles: ["bench"]
    image: drishti-loadgen:dev
    build:
      context: .
      target: loadgen
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_DIRTY: ${GIT_DIRTY:-unknown}
    # Container-to-container, like the collector (docs/loadgen.md §8): no
    # Docker Desktop port-forwarding hop between generator and receiver.
    command: ["-target", "receiver:4317"]
    # Runs as your WSL user so results in ./bench/runs are yours, not root's.
    user: "${DRISHTI_UID:-1000}:${DRISHTI_GID:-1000}"
    volumes:
      - ./bench/runs:/runs
    depends_on:
      - receiver
    networks:
      default: {}
  storage:
    image: drishti-storage:dev
    build:
      context: .
      target: storage
    # Healthy, not just started: the consumer checks the table at startup
    # and exits if ClickHouse is not answering yet.
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      DRISHTI_KAFKA_BROKERS: "kafka:29092"
      DRISHTI_CLICKHOUSE_URL: "http://clickhouse:8123"
      # A new group starts at the END of otlp.logs on this laptop: Kafka
      # holds up to 24 h of receiver-only benchmark traffic with stale
      # timestamps. Production would start at earliest (the flag default).
      # Only matters while the group has no committed offset.
      DRISHTI_STORAGE_RESET: "latest"
      # Static member: a restarted container takes over at once (docs/storage.md
      # decision 7). One replica here; more replicas need distinct IDs.
      DRISHTI_STORAGE_INSTANCE_ID: "storage-1"
      DRISHTI_STORAGE_SESSION_TIMEOUT: "15s"
      # Kill test only (week3b.sh sets it for one run): exit after the Nth
      # insert without committing it.
      DRISHTI_STORAGE_DEBUG_CRASH_AFTER_INSERTS: "${STORAGE_CRASH_AFTER:-0}"
      # Partitions decoded in parallel per poll (docs/storage.md "Parallel
      # decode"). 0 = GOMAXPROCS; week4a.sh sets 1/2/4/6 for the drain test.
      DRISHTI_STORAGE_DECODE_WORKERS: "${STORAGE_DECODE_WORKERS:-0}"
      GOMEMLIMIT: "600MiB"
      DRISHTI_PPROF_ADDR: ":6060"
    ports:
      - "127.0.0.1:16061:6060"
    # Six open batches (up to 32 MiB each) + up to 192 MiB handed to
    # background inserts (-max-pending-bytes) + one decoded message per
    # partition (parallel decode keeps one per partition, not one in all):
    # ~400 MiB at the worst case, under GOMEMLIMIT 600MiB. week4a.sh records
    # the container's memory and GC during the drain runs to check this.
    mem_limit: 768m
    networks:
      default: {}
  storage-metrics:
    # Same binary as storage, other signal: otlp.metrics -> drishti.metrics
    # (docs/storage.md decisions 9 and 10). Its own group and instance ID:
    # one process per topic, so per-partition state and the resume query
    # never mix two topics.
    image: drishti-storage:dev
    build:
      context: .
      target: storage
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      DRISHTI_STORAGE_SIGNAL: "metrics"
      DRISHTI_STORAGE_GROUP: "drishti-storage-metrics"
      DRISHTI_KAFKA_BROKERS: "kafka:29092"
      DRISHTI_CLICKHOUSE_URL: "http://clickhouse:8123"
      DRISHTI_STORAGE_RESET: "latest"
      DRISHTI_STORAGE_INSTANCE_ID: "storage-metrics-1"
      DRISHTI_STORAGE_SESSION_TIMEOUT: "15s"
      # Demo volume is small: ~150 points/s (capture B, 5 Nov: 1.29M points
      # in 2 h 23 min, ~0.9 KB/row of RowBinary, mostly repeated resource
      # attributes). 8 MiB batches and a 64 MiB pending budget bound memory
      # at ~6 x 8 + 64 = 112 MiB worst case.
      DRISHTI_BATCH_BYTES: "8388608"
      DRISHTI_MAX_PENDING_BYTES: "67108864"
      GOMEMLIMIT: "200MiB"
      DRISHTI_PPROF_ADDR: ":6060"
    ports:
      - "127.0.0.1:16064:6060"
    mem_limit: 256m
    networks:
      default: {}
  storage-anomalies:
    # The detector's events -> drishti.anomalies (docs/storage.md decision 11),
    # so the agent's tools and the evals read alerts with SQL, bounded by time.
    image: drishti-storage:dev
    build:
      context: .
      target: storage
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      DRISHTI_STORAGE_SIGNAL: "anomalies"
      DRISHTI_STORAGE_GROUP: "drishti-storage-anomalies"
      DRISHTI_KAFKA_BROKERS: "kafka:29092"
      DRISHTI_CLICKHOUSE_URL: "http://clickhouse:8123"
      # The topic holds 7 days of alerts; all of them belong in the table.
      DRISHTI_STORAGE_RESET: "earliest"
      DRISHTI_STORAGE_INSTANCE_ID: "storage-anomalies-1"
      DRISHTI_STORAGE_SESSION_TIMEOUT: "15s"
      # A few events a minute: small batches, small budget.
      DRISHTI_BATCH_BYTES: "1048576"
      DRISHTI_MAX_PENDING_BYTES: "8388608"
      GOMEMLIMIT: "64MiB"
    mem_limit: 128m
    networks:
      default: {}
  detector:
    image: drishti-detector:dev
    build:
      context: .
      target: detector
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      DRISHTI_KAFKA_BROKERS: "kafka:29092"
      # Names this instance in live.stats. More replicas split the input
      # partitions by themselves (consumer group, nothing committed); give
      # each its own name.
      DRISHTI_DETECTOR_INSTANCE: "detector-1"
      # Rebuild state from 15 min back on start (warm-up 10 min + the longest
      # window 5 min): a restart detects again within seconds.
      DRISHTI_DETECTOR_REWIND: "15m"
      GOMEMLIMIT: "256MiB"
      DRISHTI_PPROF_ADDR: ":6060"
    ports:
      - "127.0.0.1:16062:6060"
    # Peak RSS replaying the whole 3 Nov demo recording (every partition in
    # one process): 28 MiB. The rest is franz-go fetch buffers and headroom.
    mem_limit: 384m
    networks:
      default: {}
  dashboard:
    image: drishti-dashboard:dev
    build:
      context: .
      target: dashboard
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      DRISHTI_KAFKA_BROKERS: "kafka:29092"
      DRISHTI_DASHBOARD_ADDR: ":8088"
      GOMEMLIMIT: "128MiB"
      DRISHTI_PPROF_ADDR: ":6060"
    ports:
      # Loopback only: the page shows service internals.
      - "127.0.0.1:8088:8088"
      - "127.0.0.1:16063:6060"
    # 15 min of anomalies and one live snapshot a second: a few MiB.
    mem_limit: 256m
    networks:
      default: {}
  receiver:
    image: drishti-receiver:dev
    build:
      context: .
      target: receiver
    depends_on:
      - kafka
    environment:
      DRISHTI_LISTEN: ":4317"
      DRISHTI_KAFKA_BROKERS: "kafka:29092"
      GOMEMLIMIT: "400MiB"
      # Kafka batch codec; week3b.sh overrides it per run for the comparison.
      DRISHTI_KAFKA_COMPRESSION: "${RECEIVER_COMPRESSION:-lz4}"
      # Profiling endpoint (internal/pprofsrv). Idle cost is nil; a CPU
      # profile samples only while one is being fetched.
      DRISHTI_PPROF_ADDR: ":6060"
    ports:
      - "14317:4317"
      # Loopback only: profiles expose internals, so not on the LAN.
      - "127.0.0.1:16060:6060"
    # Explicit on purpose. A service that declares networks: is attached
    # ONLY to the ones it lists, so without this line, merging
    # docker-compose.demo.yml (which adds the demo network) would drop
    # default and the receiver could no longer resolve kafka:29092.
    networks:
      default: {}
    mem_limit: 512m
  kafka:
    image: apache/kafka:4.3.1
    container_name: drishti-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      # --- KRaft: one node is both broker and controller ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: zGQUL0xjSvW9aiXWByiBTw

      # --- Listeners: one for containers, one for your WSL shell ---
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Single node: internal topics can only have 1 replica ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # --- Behaviour ---
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 24

      # --- Memory: small heap, leave the rest to the page cache ---
      KAFKA_HEAP_OPTS: "-Xms1g -Xmx1g"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 3g
    # The check starts a fresh JVM (kafka-broker-api-versions.sh): ~2 cores
    # for ~2 s. At the old 10 s interval that was a ~2.3-core spike every
    # ~12 s in every benchmark run, at every rate (Week 1 sweep stats).
    # start_interval keeps startup detection fast (every 3 s during the
    # first 45 s); after that the check runs once a minute. Benchmarks start
    # at least start_period after Kafka starts.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s
      start_interval: 3s

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    container_name: drishti-clickhouse
    hostname: clickhouse
    ports:
      - "8123:8123"   # HTTP interface: curl, browser, debugging
      - "9000:9000"   # native protocol: what the Go client uses
    environment:
      CLICKHOUSE_DB: drishti
      CLICKHOUSE_USER: drishti
      CLICKHOUSE_PASSWORD: drishti_dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 6g
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "drishti", "--password", "drishti_dev", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  redis:
    image: redis:8.10.2
    container_name: drishti-redis
    hostname: redis
    ports:
      - "6381:6379"
    command:
      - redis-server
      - --maxmemory
      - 400mb
      - --maxmemory-policy
      - volatile-lru
      - --save
      - ""
      - --appendonly
      - "no"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  kafka-data:
  clickhouse-data:

networks:
  default: {}
