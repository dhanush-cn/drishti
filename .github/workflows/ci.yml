# Tests on every push to main and every pull request.
# Why it exists: patch 76 (21 Nov) broke the live agent service for 5 days because the tests that cover it need
# Postgres and were skipped on every run (patch 91). Here they run against a real Postgres, and the agent job fails if
# any test is skipped, so a test can't silently stop running again.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (vet, gofmt, race tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      # Kafka tests use an in-memory cluster (kfake) and ClickHouse tests a fake; no services needed.
      # Skipped by design: the dashboard browser test (needs Playwright) and the Loghub replay (needs the dataset).
      - name: go test -race
        run: go test -race -count=1 ./...

  agent:
    name: Agent (Python, with Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: drishti
          POSTGRES_PASSWORD: drishti_ci   # a throwaway database inside the CI job
          POSTGRES_DB: drishti_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U drishti -d drishti_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DRISHTI_TEST_POSTGRES_URL: postgresql://drishti:drishti_ci@localhost:5432/drishti_test
      # Some older tests read zone-less timestamps as local time and fail outside UTC (a known issue, not yet fixed).
      TZ: UTC
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: agent/pyproject.toml
      - name: Install the agent
        run: python -m pip install -e .
      - name: Run every agent test, none skipped
        run: |
          python -m unittest discover -s tests 2>&1 | tee test.log
          summary=$(grep -E '^(OK|FAILED)' test.log | tail -1)
          echo "summary: $summary"
          if [ "${summary%% *}" != "OK" ]; then exit 1; fi
          if echo "$summary" | grep -q skipped; then echo "tests were skipped: every test must run in CI"; exit 1; fi
